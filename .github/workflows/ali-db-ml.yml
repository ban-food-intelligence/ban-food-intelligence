name: ali-db-ml

on:
  push:
    paths: ["database-mysql/**", "ml-engine/**", ".github/workflows/ali-db-ml.yml"]
  pull_request:
    paths: ["database-mysql/**", "ml-engine/**", ".github/workflows/ali-db-ml.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ban
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pban"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ban
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: pip install -r ml-engine/requirements.txt
      - name: MySQL şema + seed + iş kuralı testleri
        run: pytest database-mysql/tests -q
      - name: KI hattı testleri
        run: pytest ml-engine/tests -q -p no:warnings
      - name: Veri üret + eğit (metrikler log'a)
        run: |
          python ml-engine/generator_ali.py
          python ml-engine/train_model_ali.py
