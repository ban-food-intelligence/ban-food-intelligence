name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also runs the slow ML job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ban

jobs:
  go:
    name: Go API (unit + integration on seeded MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ban
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pban"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: api-go/go.sum
      - name: Load schema + seed
        run: |
          mysql -h 127.0.0.1 -uroot -pban --default-character-set=utf8mb4 < database-mysql/schema.sql
          mysql -h 127.0.0.1 -uroot -pban --default-character-set=utf8mb4 < database-mysql/seed.sql
      - name: go vet + go test (integration tests use MYSQL_TEST_DSN)
        working-directory: api-go
        env:
          MYSQL_TEST_DSN: root:ban@tcp(127.0.0.1:3306)/food_intel?parseTime=true&multiStatements=true
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w"; exit 1; }
          go vet ./...
          go test -count=1 ./...

  db:
    name: MySQL schema, triggers, procedures (pytest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ban
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pban"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest database-mysql (reloads schema + seed per module)
        run: pytest database-mysql -q -p no:cacheprovider

  android:
    name: Android POS (assembleDebug + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: mobile-kotlin
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --console=plain
      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: mobile-kotlin/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  web:
    name: React dashboard (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  ml:
    name: ML engine tests (manual run only, slow)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ban
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pban"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-engine/requirements.txt
      - run: pip install -r ml-engine/requirements.txt pytest
      - name: pytest ml-engine
        run: pytest ml-engine/tests -q -p no:warnings
